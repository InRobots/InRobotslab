- name: Yang Gao
  photo: ygao.png
  info: Professor, KCL King's College London
  email: xx@jlu.edu.cn
  number_info: 1
  information: Prof. Gao is the elected Fellow of Institute of Engineering and Technology (IET) and Royal Aeronautical Society (RAeS). She is the Editor-in-Chief of Wiley Journal of Field Robotics, the Section Editor, Associate Editor or Guest Editor of other international journals such as Springer's Current Robotics Reports, Frontiers' Robotics and AI, IEEE-CIM, and IEEE-AESM, and the Chair/Co-Chair/Member of technical committees such as IMechE Engage in Space Committee, IEEE-CIS Task Force and IEEE-RAS Technical Committee on Space Robotics. Prof. Gao was the Conference General Chair of TAROS-2017 (the longest running UK-hosted international conference on AI robotics), the Conference Co-Chair of Light Conference 2018, the Conference Publicity Co-Chair of IEEE/ASME International Conference on Advanced Intelligent Mechatronics (AIM-2019), and the Invited Speaker or Session Chair of scientific conferences and seminars (such as ESA AI-STAR, IEEE-UK/Ireland RAS Prestigious Lecture, IEEE ICRA-Space Workshop, IEEE-CDC, iSAIRAS, UK Space Conference, World Congress of Robotics, IET Seminars, UK-RAS International Robotics Showcase, EMSTA Prestige Seminar, UK Astrobiology and Planetary Exploration Series, RiTA, etc). 

- name: Zexu Zhang
  photo: zxzhang.png
  info: Professor, Harbin Institute of Technology
  email: xx@jlu.edu.cn
  number_info: 1
  information: Prof. Zhang is Vice Dean of the Institute of Complex Environment Architecture, Deputy Director of the National Key Laboratory for Rapid Design and Intelligent Cluster of Micro Spacecraft, Director of the Institute of Vehicle Dynamics and Control at the School of Aerospace Science and Technology, Director of the Deep Space Exploration Basic Research Center, and Chairman of the Professor Committee of Aerospace Science and Technology. Chief Scientist of Key Basic Research Projects under the 2020 and 2024 Basic Strengthening Plan. Executive Director of the Chinese Society of Space Sciences and Chairman of the Space Intelligence Professional Committee of the Chinese Society of Space Sciences; Member of the Deep Space Exploration Technology Professional Committee of the Chinese Society of Astronautics; Member of the Command and Control Network Professional Committee of the Chinese Accusation Society.
  
- name: Meibao Yao
  photo: yaomb.png
  info: Associate professor, Jilin University
  email: meibaoyao@jlu.edu.cn
  number_info: 1
  information: Prof. Yao serves as the head of the Intelligent Robot Laboratory, School of Artificial Intelligence, Jilin University. She is youth committee member of the Space Intelligence Special Committee of the Chinese Society of Space Sciences. She serves as youth editorial board member and guest editor of Astrodynamics (CAS Q1, IF=6.4), an international journal in aerospace and astronautics. She also served as the workshop chair of the IES-ONCON 2023, IEEE-ICIT 2022, and ICASD2023 conference, as well as the area chair of the IEEE-ICPS 2021 conference and won the Best Presentation Award in Session. She served as the workshop chair of the ICRAIC 2021 conference and won the Best Organization Award and Outstanding Contribution Award. She was member of the Organizing Committee for the third International Lunar Day Event (IMD 2024), and member of the Scientific Committee of the AI in and for Space (SPACE2025) conference. 

- name: Xueming Xiao
  photo: xmxiao.png
  info: Associate professor, Changchun University of Science and Technology
  email: xx@jlu.edu.cn
  number_info: 1
  information: Prof. Xiao heads the Computer Vision and Intelligent Robots Laboratory at Changchun University of Science and Technology. He serves as senior member of the Chinese Society of Astronautics, Youth Committee Member of the Space Intelligence Special Committee of the Chinese Society of Space Sciences. He is member of the Intelligent Robotics Committee of the Chinese Computer Society and member of the Organizing Committee for the third International Day of the Moon (IMD 2024). He also served as the workshop chair of the IES-ONCON 2023 and ICASD2023 conferences. He was appointed as youth editorial board member and guest editor of Astrodynamics, an international SCI journal in the field of aerospace (CAS Q1, IF=6.4).
