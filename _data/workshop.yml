- name: Yang Gao
  photo: ygao.png
  info: Professor, KCL King's College London
  email: xx@jlu.edu.cn
  number_info: 1
  information: Prof. Gao is the elected Fellow of Institute of Engineering and Technology (IET) and Royal Aeronautical Society (RAeS). She is the Editor-in-Chief of Wiley Journal of Field Robotics. 

- name: Zexu Zhang
  photo: zxzhang.png
  info: Professor, Harbin Institute of Technology
  email: xx@jlu.edu.cn
  number_info: 1
  information: Prof. Zhang is Vice Dean of the Institute of Complex Environment Architecture, Deputy Director of the National Key Laboratory for Rapid Design and Intelligent Cluster of Micro Spacecraft. Executive Director of the Chinese Society of Space Sciences and Chairman of the Space Intelligence Professional Committee of the Chinese Society of Space Sciences.
  
- name: Meibao Yao
  photo: yaomb.png
  info: Associate professor, Jilin University
  email: meibaoyao@jlu.edu.cn
  number_info: 1
  information: Prof. Yao serves as the head of the Intelligent Robot Laboratory, School of Artificial Intelligence, Jilin University. She is youth committee member of the Space Intelligence Special Committee of the Chinese Society of Space Sciences. She serves as youth editorial board member and guest editor of Astrodynamics (CAS Q1, IF=6.4), an international journal in aerospace and astronautics. 

- name: Xueming Xiao
  photo: xmxiao.png
  info: Associate professor, Changchun University of Science and Technology
  email: xx@jlu.edu.cn
  number_info: 1
  information: Prof. Xiao heads the Computer Vision and Intelligent Robots Laboratory at Changchun University of Science and Technology. He serves as senior member of the Chinese Society of Astronautics, Youth Committee Member of the Space Intelligence Special Committee of the Chinese Society of Space Sciences. He is member of the Intelligent Robotics Committee of the Chinese Computer Society. He was appointed as youth editorial board member and guest editor of Astrodynamics.
