  information: Prof. Gao is the elected Fellow of Institute of Engineering and Technology (IET) and Royal Aeronautical Society (RAeS). She is the Editor-in-Chief of Wiley Journal of Field Robotics, the Section Editor, Associate Editor or Guest Editor of other international journals such as Springer's Current Robotics Reports, Frontiers' Robotics and AI, IEEE-CIM, and IEEE-AESM, and the Chair/Co-Chair/Member of technical committees such as IMechE Engage in Space Committee, IEEE-CIS Task Force and IEEE-RAS Technical Committee on Space Robotics.

