- name: Yang Gao
  photo: ygao.png
  info: Professor, KCL King's College London
  email: xx@jlu.edu.cn
  number_educ: 1
  information: Professor Yang Gao is a Professor of Robotics and heads the Centre for Robotics Research within the Department of Engineering at King's College London. 
  She brings over 20 years of research experience in developing space robotics and autonomous systems, in which she has been the Principal Investigator of nationally and
  internationally teamed projects funded by European Space Agency (ESA), UK Space Agency, UK Research Innovation, Royal Academy of Engineering, European Commission, 
  as well as industries. Yang is also actively involved in design and development of real-world space missions such as ESA ExoMars, Proba3 and VMMO (lunar ice mapper), 
  UK's CLEAR, MoonLITE and Moonraker, and CNSA Chang'E3. Yang's work has been applied to several non-space sectors including nuclear, utility and agriculture through 
  technology transfer and spin offs.

- name: Zexu Zhang
  photo: zxzhang.png
  info: Professor, Harbin Institute of Technology
  email: xx@jlu.edu.cn
  number_educ: 1
  information:  Professor Zexu Zhang is the Deputy Director of the Institute of Architecture in Complex Environments at Harbin Institute of Technology, and also the Deputy 
  Director of the National Key Laboratory of "Rapid Design and Intelligent Clustering of Micro - Nano Spacecraft". He heads the Institute of Flight Vehicle Dynamics and Control at the School of Astronautics.
  
