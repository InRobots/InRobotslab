- name: Zhongkui Wang
  photo: zkwang.jpg
  info: Professor, Ritsumeikan University, Japan
  email: xx@jlu.edu.cn
  title: Title:Soft Robotics for Agrifood applications
  number_info: 2
  information1: Prof. Zhongkui Wang received the Ph.D. degree in robotics from Ritsumeikan University, Kusatsu, Japan, in 2011. From 2011 to 2012 and 2012 to 2014, he was a Research Associate and a Postdoctoral Fellow, respectively, with Ritsumeikan University. During his Postdoc, he visited ETH Zurich for six months as a visiting scholar. From 2014-2019, he was an Assistant Professor with Ritsumeikan University. Since 2019, he became an Associate Professor with Ritsumeikan University. His research interests mainly include soft robotics, 4D printing, biomedical engineering, and automation in food industry and agriculture.  
  # information2: He received the Best Paper Award on Robotics at the 2018 IEEE International Conference on Realtime Computing and Robotics, and the Best Paper Award at the IEEE 24th International Conference on Mechatronics and Machine Vision in Practice. He is an Associate Editor for the IEEE Robotics and Automation Letters and an Editorial Board Member of Chinese Journal of Mechanical Engineering and Biomimetic Intelligence and Robotics. In addition, he served as the General Chair of IEEE RCAR 2025, and Organizing Committee Members of many other international conferences, such as IEEE ICRA 2024, IEEE/SICE SII 2024, IEEE/RSJ IROS 2022, and so on. Prof. Wang is a senior member of IEEE, and a member of RSJ and JSME.  
  
- name: Mingfeng Wang
  photo: mfwang.jpg
  info: Associate Professor, Brunel University of London, UK
  email: xx@jlu.edu.cn
  title: Title:Towards Specialised Robotic Systems in Challenging Environments
  number_info: 3
  information1: |
    Dr Mingfeng Wang is a Senior Lecturer (Associate Professor) in Robotics & Autonomous Systems at the Department of Mechanical and Aerospace Engineering, Brunel University of London. Before joining Brunel, he was a Research Fellow (2017.08-2021.06) at the Rolls-Royce UTC in Manufacturing and On-Wing Repair, University of Nottingham (UK), and worked as a principal researcher on inspection and maintenance robotics for the aerospace and nuclear industry. Before this, he was a Senior Research Associate (2016.08-2017.08) at the National Centre for Precision Farming, Harper Adams University (UK), and worked on laser weeding robotics for organic farming.  
  # information2: | 
    His research interests focus on innovative design, modelling and control of specialised robotic systems, aiming to tackle challenging maintenance and repair operations (MRO) in hazardous environments (e.g. rail, air, nuclear, etc). He currently is leading two research projects (one from EPSRC and the other from Brunel University London) covering these research interests. In recognition of his innovation in the specialised robotics for MRO, Dr Wang is the university (Brunel University London) representative member of the UK Rail Research and Innovation Network (UKRRIN) and Rail Safety and Standards Board (RSSB).  
  information3: |
    With more than 10 years’ experience in robotics, he has participated as the leading researcher in a number of projects funded by the EPSRC (Through-life performance: From science to instrumentation 2017-2021, Robotics and Artificial Intelligence for Nuclear (RAIN) 2017-2022) and Innovate UK (HyperWeeding 2016-2017, FLARE 2017-2019). In the last five years, he has published more than 40 papers in leading journals (IEEE/ASME Transactions on Mechatronics, Robotics and Computer-Integrated Manufacturing, Mechanism and Machine Theory, Journal of Mechanisms and Robotics, etc.) and conferences (IROS, ICRA, CASE, etc.) and filed 3 international patents.   


  
- name: Yanfang Liu
  photo: yfliu.jpg
  info: Professor, Harbin Institute of Technology, China
  email: xx@jlu.edu.cn
  title: Title:Key Technologies of Active Exoskeletons and Their Ground Testing Aimed at Long-term Lunar Habitation
  number_info: 2
  information1: Yanfang Liu is a professor and doctoral supervisor in Harbin Institute of Technology. He was awarded the titles of National High-Level Young Talent, Distinguished Young Scholar of the Ministry of Industry and Information Technology, "Xiaomi" Young Scholar, and Young Science and Technology Award winner of Heilongjiang Province. He engaged in research on visual target recognition, pose measurement, positioning and tracking technology, autonomous intelligence of aerial vehicles, intelligent assembly and testing, mechatronics and its ground-based simulation testing, specialized wafer forming and precision sand-etching processing of specialized chips, etc.  
  # information2: He serves as an editorial board member of Aerospace Systems, Journal of Astronautics, Journal of Mechanical Engineering (English Edition), etc. He has received one National Technological Invention Second Prize, three First Prizes of Technological Invention at the provincial and ministerial levels, and one Heilongjiang Provincial Patent Silver Award. He has published over 90 academic papers, more than 60 invention patents, and led multiple national-level research projects, 
  
