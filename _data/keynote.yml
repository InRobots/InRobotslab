- name: Mingfeng Wang
  photo: mfwang.jpg
  info: Associate Professor, Brunel University of London, UK
  email: xx@jlu.edu.cn
  title: Title:Towards Specialised Robotic Systems in Challenging Environments
  number_info: 1
  information: |
    Dr Mingfeng Wang is a Senior Lecturer (Associate Professor) in Robotics & Autonomous Systems at the Department of Mechanical and Aerospace Engineering, Brunel University of London.  
    Before joining Brunel, he was a Research Fellow (2017.08-2021.06) at the Rolls-Royce UTC in Manufacturing and On-Wing Repair, University of Nottingham (UK), and worked as a principal  
    researcher on inspection and maintenance robotics for the aerospace and nuclear industry. Before this, he was a Senior Research Associate (2016.08-2017.08) at the  
    National Centre for Precision Farming, Harper Adams University (UK), and worked on laser weeding robotics for organic farming.  
  
