- name: Mingfeng Wang
  photo: mfwang.png
  info: Associate Professor, Brunel University of London, UK
  email: xx@jlu.edu.cn
  title: Title:Towards Specialised Robotic Systems in Challenging Environments
  number_info: 1
  information: Dr Mingfeng Wang is a Senior Lecturer (Associate Professor) in Robotics & Autonomous Systems at the Department of Mechanical and Aerospace Engineering, Brunel University of London. Before joining Brunel, he was a Research Fellow (2017.08-2021.06) at the Rolls-Royce UTC in Manufacturing and On-Wing Repair,
  University of Nottingham (UK), and worked as a principal researcher on inspection and maintenance robotics for the aerospace and nuclear industry. Before this, he was a Senior Research Associate (2016.08-2017.08) at the National Centre for Precision Farming, Harper Adams University (UK), and worked on laser weeding robotics for organic farming. He received his B.Eng. (Hons, 2008) in Mechanical Design & Automation and M.Eng. (Distinction, 2012) in Mechanical Engineering from Central South University (China), and his Ph.D. (2016)
  in Mechanical Engineering from the University of Cassino and Southern Lazio (Italy). His research interests focus on innovative design, modelling and control of specialised robotic systems, 
  aiming to tackle challenging maintenance and repair operations (MRO) in hazardous environments (e.g. rail, air, nuclear, etc). He currently is leading two research projects (one from EPSRC
  and the other from Brunel University London) covering these research interests. In recognition of his innovation in the specialised robotics for MRO, Dr Wang is the university (Brunel University London)
  representative member of the UK Rail Research and Innovation Network (UKRRIN) and Rail Safety and Standards Board (RSSB). 
  With more than 10 years’ experience in robotics, he has participated as the leading researcher in a number of projects funded by the EPSRC and Innovate UK. In the last five years, he has published more
  than 40 papers in leading journals (IEEE/ASME Transactions on Mechatronics, Robotics and Computer-Integrated Manufacturing, Mechanism and Machine Theory, Journal of Mechanisms and Robotics, etc.) 
  and conferences (IROS, ICRA, CASE, etc.) and filed 3 international patents. 

